name: CI/CD Pipeline - ITAM Modular Monolith

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # =========================================================================
  # JOB 1: BACKEND CONTINUOUS INTEGRATION (Compile & Test)
  # =========================================================================
  backend-ci:
    name: Backend CI (Gradle + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile & Run Backend Tests
        run: ./gradlew test --no-daemon

  # =========================================================================
  # JOB 2: FRONTEND CONTINUOUS INTEGRATION (Lint & Build)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node.js + React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Frontend Production Artifacts
        run: npm run build

  # =========================================================================
  # JOB 3: DOCKER IMAGE BUILD & PUSH (Runs only on Push to master/main)
  # =========================================================================
  docker-build-push:
    name: Docker Build & Push Images
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/itam-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/itam-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/itam-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/itam-frontend:${{ github.sha }}

  # =========================================================================
  # JOB 4: CONTINUOUS DEPLOYMENT TO REMOTE SERVER (Optional VPS Deploy)
  # =========================================================================
  deploy-server:
    name: Deploy to Remote Server (VPS)
    needs: [docker-build-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && secrets.SERVER_HOST != ''
    runs-on: ubuntu-latest

    steps:
      - name: SSH to Server & Update Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/source_code
            docker compose pull
            docker compose up -d --remove-orphans
