server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: itam-backend

  # ===============================
  # DATABASE & ORM CONFIGURATION
  # ===============================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itam_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:your_db_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ===============================
  # FLYWAY MIGRATION (DISABLED)
  # ===============================
  flyway:
    enabled: false

  # ===============================
  # DEVTOOLS CONFIGURATION
  # ===============================
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**

  # ===============================
  # CACHING (REDIS)
  # ===============================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}

  # ===============================
  # MESSAGE BROKER (RABBITMQ)
  # ===============================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}

  # ===============================
  # EMAIL CONFIGURATION
  # ===============================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_email_app_password_here}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ===============================
# CUSTOM APP CONFIGURATIONS
# ===============================
app:
  # JWT Config
  jwt:
    secret: ${JWT_SECRET:your_base64_encoded_jwt_secret_key_minimum_256_bits_length_here}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:604800000} # 7 ngay (7 * 24 * 60 * 60 * 1000)
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 ngay (30 * 24 * 60 * 60 * 1000)

  # Cloudflare R2 Config (Tuong thich voi AWS S3 API)
  r2:
    endpoint: ${R2_ENDPOINT:your_cloudflare_r2_endpoint_url}
    region: ${R2_REGION:auto} # R2 thuong dung auto region
    access-key: ${R2_ACCESS_KEY:your_cloudflare_r2_access_key}
    secret-key: ${R2_SECRET_KEY:your_cloudflare_r2_secret_key}
    bucket-name: ${R2_BUCKET_NAME:your_r2_bucket_name}
    public-url: ${R2_PUBLIC_URL:your_r2_public_url}
